<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CSV Bereiniger (lokal)</title>
</head>
<body>
  <h2>CSV-Datei bereinigen</h2>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="processCSV()">Bereinigen & Herunterladen</button>

  <script>
    function parseDate(dateStr) {
      // Format: "15.04.2025 10:23"
      const [date, time] = dateStr.split(' ');
      const [day, month, year] = date.split('.');
      const [hours, minutes] = time.split(':');
      return new Date(year, month - 1, day, hours, minutes);
    }

    function processCSV() {
      const fileInput = document.getElementById('csvFile');
      const file = fileInput.files[0];
      if (!file) {
        alert('Bitte eine CSV-Datei auswählen.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const content = e.target.result;
        const rows = content.trim().split('\n');
        const header = rows[0].split(';').map(h => h.replace(/^"(.*)"$/, '$1').trim());

        const importIdIndex = header.indexOf('Import-ID');
        const dateIndex = header.indexOf('Ausgefüllt am');

        if (importIdIndex === -1 || dateIndex === -1) {
          alert('Die CSV-Datei muss die Spalten "Import-ID" und "Ausgefüllt am" enthalten.');
          return;
        }

        const dataMap = {};

        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i].split(';').map(col => col.replace(/^"(.*)"$/, '$1').trim());
          const id = cols[importIdIndex];
          const date = parseDate(cols[dateIndex]);

          if (!dataMap[id] || date > dataMap[id].parsedDate) {
            dataMap[id] = {
              row: cols,
              parsedDate: date
            };
          }
        }

        // Neue CSV generieren
        const cleanedRows = [header.join(';')];
        for (const key in dataMap) {
          cleanedRows.push(dataMap[key].row.join(';'));
        }

        const blob = new Blob([cleanedRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bereinigt.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      reader.readAsText(file);
    }
  </script>
</body>
</html>
